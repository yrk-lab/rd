name: CI

on:
  push:
  pull_request:

env:
  PLAN9: /usr/lib/plan9

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install plan9port
        run: |
          sudo apt-get install -y plan9port
          echo "$PLAN9/bin" >> $GITHUB_PATH
      - name: Run tests
        run: mk test

  build:
    name: Build binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install plan9port
        run: |
          sudo apt-get install -y plan9port
          echo "$PLAN9/bin" >> $GITHUB_PATH
      - name: Build o.thread
        run: mk o.thread

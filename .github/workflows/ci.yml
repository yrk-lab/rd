name: CI

on:
  push:
  pull_request:

env:
  PLAN9: /opt/plan9port
  PLAN9FRONT: /opt/9front

permissions:
  contents: read

jobs:
  setup:
    name: Set up plan9port
    runs-on: ubuntu-latest
    steps:
      - name: Cache plan9port
        id: cache-plan9port
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAN9 }}
          key: plan9port-${{ runner.os }}-v1
      - name: Install plan9port build dependencies
        run: sudo apt-get install -y gcc libx11-dev libxt-dev libxext-dev libfontconfig1-dev
      - name: Build plan9port
        if: steps.cache-plan9port.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 https://github.com/9fans/plan9port $PLAN9
          cd $PLAN9
          ./INSTALL

  test:
    name: Run tests
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore plan9port cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAN9 }}
          key: plan9port-${{ runner.os }}-v1
      - name: Add plan9port to PATH
        run: echo "$PLAN9/bin" >> $GITHUB_PATH
      - name: Run tests
        run: mk test

  build:
    name: Build binary
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore plan9port cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAN9 }}
          key: plan9port-${{ runner.os }}-v1
      - name: Add plan9port to PATH
        run: echo "$PLAN9/bin" >> $GITHUB_PATH
      - name: Build o.thread
        run: mk o.thread

  setup-9front:
    name: Set up 9front
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Cache 9front
        id: cache-9front
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAN9FRONT }}
          key: 9front-${{ runner.os }}-v3
      - name: Install dependencies
        if: steps.cache-9front.outputs.cache-hit != 'true'
        run: sudo apt-get install -y build-essential
      - name: Restore plan9port cache
        if: steps.cache-9front.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAN9 }}
          key: plan9port-${{ runner.os }}-v1
      - name: Download 9front ISO
        if: steps.cache-9front.outputs.cache-hit != 'true'
        run: |
          mkdir -p $PLAN9FRONT
          PAGE=$(curl -fsSL http://9front.org/releases/)
          ISO_URL=$(printf '%s\n' "$PAGE" | grep -Eo 'https?://9front\.org/iso/[^ "<]+amd64[^ "<]+\.torrent' | head -1 | sed 's/\.torrent$//')
          if [ -z "$ISO_URL" ]; then
            ISO_URL=$(printf '%s\n' "$PAGE" | grep -Eo 'https?://9front\.org/iso/[^ "<]+amd64[^ "<]+\.iso(\.gz)?' | grep -v torrent | head -1)
          fi
          if [ -z "$ISO_URL" ]; then
            echo "Could not find amd64 ISO URL on http://9front.org/releases/" >&2
            exit 1
          fi
          echo "Downloading: $ISO_URL"
          curl -fL -o /tmp/9front.iso.tmp "$ISO_URL"
          if echo "$ISO_URL" | grep -q '\.gz$'; then
            gunzip -c /tmp/9front.iso.tmp > /tmp/9front.iso
            rm /tmp/9front.iso.tmp
          else
            mv /tmp/9front.iso.tmp /tmp/9front.iso
          fi
      - name: Extract 9front root and kernel
        if: steps.cache-9front.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /mnt/9front
          mkdir -p $PLAN9FRONT/root
          sudo mount -o loop,ro /tmp/9front.iso /mnt/9front
          cp -a /mnt/9front/. $PLAN9FRONT/root/
          chmod -R u+w $PLAN9FRONT/root/
          cp $PLAN9FRONT/root/amd64/9pc64 $PLAN9FRONT/9pc64
          sudo umount /mnt/9front
      - name: Build u9fs from plan9foundation source
        if: steps.cache-9front.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 --filter=blob:none --sparse \
            https://github.com/plan9foundation/plan9 /tmp/plan9-src
          cd /tmp/plan9-src
          git sparse-checkout set sys/src/cmd/unix/u9fs
          cd sys/src/cmd/unix/u9fs
          make CFLAGS="-g -I. -Wno-implicit-function-declaration -DBit5=2 -DRunemax=0x10FFFF"
          cp u9fs $PLAN9FRONT/u9fs

  build-9front:
    name: Build binary (9front)
    needs: setup-9front
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore 9front cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAN9FRONT }}
          key: 9front-${{ runner.os }}-v3
      - name: Install QEMU and socat
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 socat
      - name: Copy source into 9front root
        run: cp -r $GITHUB_WORKSPACE $PLAN9FRONT/root/rd
      - name: Write termrc
        if: false
        run: |
          cat > $PLAN9FRONT/root/rc/bin/termrc << 'EOF'
          cd /rd
          mk
          if(~ $status '')
            echo 0 > /exitcode
          if not
            echo 1 > /exitcode
          echo reboot > /dev/sysctl
          EOF
      - name: Prepare u9fs user database in 9front root
        run: |
          mkdir -p $PLAN9FRONT/root/etc
          getent passwd "$(id -un)" >> $PLAN9FRONT/root/etc/passwd
          getent group "$(id -gn)" >> $PLAN9FRONT/root/etc/group
      - name: Boot 9front VM and build
        run: |
          sudo socat TCP4-LISTEN:564,fork,reuseaddr \
            EXEC:"$PLAN9FRONT/u9fs -l $PLAN9FRONT/u9fs-build.log -a none -u $(id -un) $PLAN9FRONT/root" &
          for i in $(seq 30); do nc -z localhost 564 2>/dev/null && break || sleep 0.5; done
          yes "" | timeout 300 qemu-system-x86_64 \
            -nographic \
            -no-reboot \
            -m 1G \
            -kernel $PLAN9FRONT/9pc64 \
            -append 'nobootprompt=tcp fs=10.0.2.2 auth=10.0.2.2 console=0 b115200 user=glenda *nousbprobe=1' \
            -netdev user,id=net0,net=10.0.2.0/24,dhcpstart=10.0.2.15 \
            -device e1000,netdev=net0,mac=00:20:91:37:33:77 \
            -object filter-dump,id=dump0,netdev=net0,file=/tmp/build-net.pcap \
            || true
      - name: Upload diagnostics (build)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-9front-diag
          path: |
            /tmp/build-net.pcap
            ${{ env.PLAN9FRONT }}/u9fs-build.log
          if-no-files-found: ignore
      - name: Check result
        run: |
          result=$(cat $PLAN9FRONT/root/exitcode 2>/dev/null | head -1 | tr -d '[:space:]')
          [ "${result:-1}" -eq 0 ]

  test-9front:
    name: Run tests (9front)
    needs: setup-9front
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore 9front cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAN9FRONT }}
          key: 9front-${{ runner.os }}-v3
      - name: Install QEMU and socat
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 socat
      - name: Copy source into 9front root
        run: cp -r $GITHUB_WORKSPACE $PLAN9FRONT/root/rd
      - name: Write termrc
        if: false
        run: |
          cat > $PLAN9FRONT/root/rc/bin/termrc << 'EOF'
          cd /rd
          mk test
          if(~ $status '')
            echo 0 > /exitcode
          if not
            echo 1 > /exitcode
          echo reboot > /dev/sysctl
          EOF
      - name: Prepare u9fs user database in 9front root
        run: |
          mkdir -p $PLAN9FRONT/root/etc
          getent passwd "$(id -un)" >> $PLAN9FRONT/root/etc/passwd
          getent group "$(id -gn)" >> $PLAN9FRONT/root/etc/group
      - name: Boot 9front VM and test
        run: |
          sudo socat TCP4-LISTEN:564,fork,reuseaddr \
            EXEC:"$PLAN9FRONT/u9fs -l $PLAN9FRONT/u9fs-test.log -a none -u $(id -un) $PLAN9FRONT/root" &
          for i in $(seq 30); do nc -z localhost 564 2>/dev/null && break || sleep 0.5; done
          yes "" | timeout 300 qemu-system-x86_64 \
            -nographic \
            -no-reboot \
            -m 1G \
            -kernel $PLAN9FRONT/9pc64 \
            -append 'nobootprompt=tcp fs=10.0.2.2 auth=10.0.2.2 console=0 b115200 user=glenda *nousbprobe=1' \
            -netdev user,id=net0,net=10.0.2.0/24,dhcpstart=10.0.2.15 \
            -device e1000,netdev=net0,mac=00:20:91:37:33:77 \
            -object filter-dump,id=dump0,netdev=net0,file=/tmp/test-net.pcap \
            || true
      - name: Upload diagnostics (test)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-9front-diag
          path: |
            /tmp/test-net.pcap
            ${{ env.PLAN9FRONT }}/u9fs-test.log
          if-no-files-found: ignore
      - name: Check result
        run: |
          result=$(cat $PLAN9FRONT/root/exitcode 2>/dev/null | head -1 | tr -d '[:space:]')
          [ "${result:-1}" -eq 0 ]
